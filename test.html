<!DOCTYPE html>
<html>
    <head>
        <title>soal 1 pemrograman web dasar</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            :root {
                --ink: #19242a;
                --muted: #65747a;
                --paper: rgba(255, 253, 248, 0.93);
                --line: #d8e0dc;
                --mint: #1e8f79;
                --mint-dark: #126052;
                --coral: #e7785d;
                --yellow: #f3c969;
                --shadow: 0 24px 70px rgba(25, 57, 54, 0.16);
            }

            * { box-sizing: border-box; }

            html { min-height: 100%; }

            body {
                position: relative;
                isolation: isolate;
                max-width: 860px;
                margin: 0 auto;
                padding: 76px 74px 64px;
                color: var(--ink);
                background:
                    radial-gradient(circle at 8% 12%, rgba(243, 201, 105, .55) 0 9%, transparent 10%),
                    radial-gradient(circle at 92% 8%, rgba(231, 120, 93, .30) 0 12%, transparent 13%),
                    linear-gradient(135deg, #edf8f1 0%, #fff8eb 55%, #f7ebe9 100%);
                font-family: Georgia, "Times New Roman", serif;
                line-height: 1.55;
                min-height: 100vh;
            }

            body::before {
                content: "";
                position: fixed;
                z-index: -1;
                inset: 22px;
                border: 1px solid rgba(30, 143, 121, .18);
                border-radius: 28px;
                pointer-events: none;
            }

            body::after {
                content: "PENDAFTARAN  /  2026";
                position: absolute;
                top: 28px;
                right: 74px;
                color: var(--mint);
                font: 700 11px/1 Arial, sans-serif;
                letter-spacing: .22em;
            }

            h1 {
                max-width: 580px;
                margin: 0 0 18px;
                color: var(--mint-dark);
                font-size: clamp(2.45rem, 6vw, 4.6rem);
                font-weight: 400;
                line-height: .98;
                letter-spacing: -.045em;
            }

            h1::after {
                content: "";
                display: block;
                width: 76px;
                height: 7px;
                margin-top: 24px;
                border-radius: 99px;
                background: var(--coral);
                transform: rotate(-2deg);
            }

            p {
                color: var(--muted);
                font-family: Arial, sans-serif;
                font-size: .93rem;
            }

            body > p:first-of-type {
                max-width: 560px;
                margin: 0 0 30px;
                padding: 18px 22px;
                border-left: 4px solid var(--yellow);
                background: rgba(255, 255, 255, .52);
            }

            body > p:nth-of-type(2) {
                margin: 34px 0 12px;
                color: var(--mint-dark);
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: .14em;
            }

            label {
                display: inline-block;
                margin: 12px 0 5px;
                color: #34464a;
                font: 700 .72rem/1.2 Arial, sans-serif;
                letter-spacing: .08em;
                text-transform: uppercase;
            }

            input:not([type="radio"]):not([type="file"]),
            select,
            textarea {
                display: block;
                width: 100%;
                max-width: 580px;
                padding: 13px 15px;
                border: 1px solid var(--line);
                border-radius: 10px;
                outline: none;
                color: var(--ink);
                background: rgba(255, 255, 255, .75);
                font: 16px Arial, sans-serif;
                transition: border-color .2s, box-shadow .2s, background .2s;
            }

            textarea { resize: vertical; }

            input:not([type="radio"]):not([type="file"]):focus,
            select:focus,
            textarea:focus {
                border-color: var(--mint);
                background: #fff;
                box-shadow: 0 0 0 4px rgba(30, 143, 121, .13);
            }

            input[type="radio"] {
                accent-color: var(--mint);
                margin: 0 4px 0 10px;
            }

            input[type="radio"] + label {
                margin: 12px 4px 0 0;
                font-weight: 400;
                letter-spacing: 0;
                text-transform: none;
            }

            input[type="file"] {
                width: 100%;
                max-width: 580px;
                padding: 12px;
                border: 1px dashed var(--mint);
                border-radius: 10px;
                color: var(--muted);
                background: rgba(255, 255, 255, .45);
                font: 14px Arial, sans-serif;
            }

            button {
                margin: 12px 8px 0 0;
                padding: 13px 22px;
                border: 0;
                border-radius: 9px;
                color: white;
                background: var(--mint-dark);
                cursor: pointer;
                font: 700 12px Arial, sans-serif;
                letter-spacing: .12em;
                text-transform: uppercase;
                box-shadow: 0 8px 18px rgba(18, 96, 82, .18);
                transition: transform .2s, box-shadow .2s, background .2s;
            }

            button[type="reset"] {
                color: var(--mint-dark);
                background: transparent;
                border: 1px solid var(--mint);
                box-shadow: none;
            }

            button:hover {
                background: var(--coral);
                box-shadow: 0 12px 22px rgba(231, 120, 93, .24);
                transform: translateY(-2px);
            }

            button[type="reset"]:hover { color: white; }

            .form-accent {
                position: absolute;
                top: 155px;
                right: 48px;
                width: 92px;
                height: 92px;
                border: 1px solid rgba(30, 143, 121, .45);
                border-radius: 50%;
                transform: rotate(18deg);
                pointer-events: none;
            }

            .form-accent::before {
                content: "✦";
                position: absolute;
                top: 20px;
                left: 31px;
                color: var(--coral);
                font-size: 28px;
            }

            .form-progress {
                position: fixed;
                right: 25px;
                bottom: 24px;
                z-index: 5;
                width: 180px;
                padding: 11px 13px;
                border: 1px solid rgba(30, 143, 121, .18);
                border-radius: 12px;
                background: rgba(255, 253, 248, .92);
                box-shadow: 0 12px 30px rgba(25, 57, 54, .12);
                font: 700 10px Arial, sans-serif;
                letter-spacing: .08em;
            }

            .form-progress span { display: block; margin-bottom: 7px; color: var(--muted); }
            .progress-track { height: 5px; overflow: hidden; border-radius: 10px; background: #dfe9e2; }
            .progress-value { width: 0%; height: 100%; border-radius: inherit; background: var(--coral); transition: width .3s ease; }

            .notice {
                position: fixed;
                top: 24px;
                left: 50%;
                z-index: 10;
                padding: 12px 18px;
                border-radius: 99px;
                color: white;
                background: var(--mint-dark);
                font: 700 12px Arial, sans-serif;
                transform: translate(-50%, -150%);
                transition: transform .3s ease;
            }

            .notice.show { transform: translate(-50%, 0); }

            .status-bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 18px;
                margin: -34px 0 30px;
                padding: 10px 12px 10px 16px;
                border: 1px solid rgba(30, 143, 121, .17);
                border-radius: 99px;
                background: rgba(255, 255, 255, .48);
                box-shadow: 0 9px 24px rgba(25, 57, 54, .05);
                font: 700 10px Arial, sans-serif;
                letter-spacing: .1em;
                text-transform: uppercase;
            }

            .status-live { display: inline-flex; align-items: center; gap: 8px; color: var(--mint-dark); }
            .status-live::before {
                content: "";
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--mint);
                box-shadow: 0 0 0 5px rgba(30, 143, 121, .12);
                animation: pulse 2s ease-in-out infinite;
            }

            .focus-toggle {
                padding: 7px 11px;
                margin: 0;
                color: var(--mint-dark);
                background: rgba(255, 255, 255, .58);
                border: 1px solid rgba(30, 143, 121, .3);
                box-shadow: none;
                font-size: 9px;
            }

            .focus-toggle:hover { color: white; }

            .identity-preview {
                position: absolute;
                top: 208px;
                right: 74px;
                width: 165px;
                padding: 15px;
                border-radius: 15px;
                color: white;
                background: linear-gradient(145deg, var(--mint-dark), #289b82);
                box-shadow: 0 16px 30px rgba(18, 96, 82, .18);
                transform: rotate(3deg);
                transition: transform .25s ease;
            }

            .identity-preview:hover { transform: rotate(0) translateY(-4px); }
            .preview-kicker { display: block; opacity: .7; font: 700 9px Arial, sans-serif; letter-spacing: .15em; }
            .preview-name { display: block; min-height: 30px; margin-top: 8px; font: 400 20px/1.1 Georgia, serif; overflow-wrap: anywhere; }
            .preview-line { display: block; width: 42px; height: 3px; margin-top: 13px; border-radius: 9px; background: var(--yellow); }

            .focus-mode { max-width: 720px; }
            .focus-mode .identity-preview,
            .focus-mode .form-accent { opacity: .12; }
            .focus-mode .status-bar { opacity: .45; }

            @keyframes pulse {
                0%, 100% { opacity: 1; transform: scale(1); }
                50% { opacity: .55; transform: scale(.78); }
            }

            @media (max-width: 640px) {
                body { padding: 56px 25px 110px; }
                body::after { right: 25px; font-size: 9px; }
                body::before { inset: 12px; border-radius: 18px; }
                .form-accent { top: 112px; right: 18px; width: 60px; height: 60px; opacity: .7; }
                .form-accent::before { top: 11px; left: 20px; font-size: 20px; }
                h1 { max-width: 80%; font-size: 3rem; }
                .form-progress { right: 20px; bottom: 15px; left: 20px; width: auto; }
                .status-bar { margin-top: -18px; }
                .identity-preview { position: relative; top: auto; right: auto; width: 100%; margin: 0 0 28px; transform: rotate(-1deg); }
            }
        </style>
    </head>
    <body>
        <div class="status-bar">
            <span class="status-live">Portal pendaftaran aktif</span>
            <button class="focus-toggle" type="button">Mode fokus</button>
        </div>

        <div class="identity-preview" aria-live="polite">
            <span class="preview-kicker">KARTU IDENTITAS</span>
            <span class="preview-name">Nama kamu</span>
            <span class="preview-line"></span>
        </div>
        <p>silahkan isi formulir berikut dengan data diri anda secara lengkap dan benar<br>

        <p>data akademik</p>
          <label for="prodi">Program Studi:</label><br>
            <select id="prodi" name="prodi">
            <option value="informatika">Informatika</option>

            </select>
            <br><br>
        <br>
            <label for="alamat">Alamat:</label><br>
            <textarea id="alamat" name="alamat" rows="4"></textarea>
            </form>
        <br><br>
        <p style="margin-bottom: 5px;">upload foto :</p>
        <form action= "/action_page.php">
            <input type="file" id="myfile" name="filename">
        </form>
        <br><br>
            <button type="submit">simpan</button>
            <button type="reset">Reset</button>
        <span class="form-accent" aria-hidden="true"></span>
        <aside class="form-progress" aria-live="polite">
            <span>KELENGKAPAN FORMULIR <b>0%</b></span>
            <div class="progress-track"><div class="progress-value"></div></div>
        </aside>
        <div class="notice" role="status">Data siap disimpan.</div>
        <script>
            const fields = [...document.querySelectorAll('input:not([type="radio"]), select, textarea')];
            const progressText = document.querySelector('.form-progress b');
            const progressValue = document.querySelector('.progress-value');
            const notice = document.querySelector('.notice');
            const nameField = document.querySelector('input[name="nama lengkap"]');
            const previewName = document.querySelector('.preview-name');
            const focusToggle = document.querySelector('.focus-toggle');
            const updateProgress = () => {
                const completed = fields.filter((field) => field.value.trim()).length;
                const percentage = Math.round((completed / fields.length) * 100);
                progressText.textContent = `${percentage}%`;
                progressValue.style.width = `${percentage}%`;
            };
            nameField.addEventListener('input', () => {
                previewName.textContent = nameField.value.trim() || 'Nama kamu';
            });
            focusToggle.addEventListener('click', () => {
                document.body.classList.toggle('focus-mode');
                focusToggle.textContent = document.body.classList.contains('focus-mode') ? 'Keluar fokus' : 'Mode fokus';
            });
            fields.forEach((field) => field.addEventListener('input', updateProgress));
            document.querySelector('button[type="reset"]').addEventListener('click', () => setTimeout(updateProgress));
            document.querySelector('button[type="submit"]').addEventListener('click', () => {
                notice.classList.add('show');
                setTimeout(() => notice.classList.remove('show'), 2600);
            });
            updateProgress();
        </script>
    </body>
</html>
